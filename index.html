<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>GengisBall</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap"
      rel="stylesheet"
    />

      :root {
        --bg: #f4efe3;
        --ink: #2b2118;

        --sky2: #f9e7c2;
        --wall: #3a2d22;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #17120d;
          --ink: #f6ead6;
          --panel: #2a2117;
          --sky1: #1f4a4a;
          --sky2: #5a3b22;
          --wall: #e9d7b8;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: 'Fredoka', system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .hud {
        display: none;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        width: min(92vw, calc((100dvh - 110px) * 0.5625));
        font-weight: 700;
      }
      .hud.on {
        display: flex;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      .hud button {
        background: var(--panel);
        border: 2px solid var(--ink);
        border-radius: 999px;
        padding: 2px 14px;
      }
      button:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      .wrap {
        position: relative;
        height: calc(100dvh - 110px);
        aspect-ratio: 9/16;
        max-width: 92vw;
      }
      canvas#c {
        width: 100%;
        height: 100%;
        border-radius: 18px;
        border: 3px solid var(--ink);
        display: block;
      }
      .scr,
      .ov {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        border-radius: 18px;
        padding: 16px;
        box-sizing: border-box;
        text-align: center;
      }
      .scr {
        background: var(--panel);
        border: 3px solid var(--ink);
      }
      .ov {
        background: rgba(20, 12, 4, 0.55);
        color: #fff;
      }
      .scr.on,
      .ov.on {
        display: flex;
      }
      h1 {
        margin: 0;
        font-size: 3.2rem;
        line-height: 1;
      }
      h2 {
        margin: 0;
        font-size: 1.8rem;
      }
      .btn {
        background: var(--accent);
        color: #2b1700;
        border: 0;
        border-radius: 999px;
        padding: 12px 30px;
        font-weight: 700;
        font-size: 1.2rem;
        min-width: 200px;
      }
      .btn.g {
        background: transparent;
        color: var(--ink);
        border: 2px solid var(--ink);
      }
      .ov .btn.g {
        color: #fff;
        border-color: #fff;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        width: 100%;
      }
      .grid button {
        background: var(--bg);
        border: 2px solid var(--ink);
        border-radius: 14px;
        padding: 8px 2px;
        font-weight: 700;
      }
      .grid button small {
        display: block;
        font-weight: 500;
        opacity: 0.8;
      }
      .grid button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .grid button.sel {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent);
      }
      .st {
        color: #ffc53d;
        letter-spacing: 0.1em;
      }
      .ov .st {
        font-size: 2.4rem;
      }
      .hint {
        font-size: 0.85rem;
        opacity: 0.75;
        margin: 0;
      }
      #levels,
      #skins {
        justify-content: flex-start;
        overflow-y: auto;
      }
      #menu,
      #prof {
        overflow-y: auto;
        justify-content: safe center;
      }
      input {
        font: inherit;
        padding: 8px 14px;
        border: 2px solid var(--ink);
        border-radius: 999px;
        background: var(--bg);
        color: var(--ink);
        text-align: center;
        width: 80%;
        box-sizing: border-box;
        user-select: text;
        -webkit-user-select: text;
        touch-action: auto;
      }
      .rk {
        font-size: 0.9rem;
        width: 100%;
        text-align: left;
      }
      small.c {
        font-size: 0.7rem;
        opacity: 0.7;
        word-break: break-all;
      }
      .grid h3 {
        grid-column: 1/-1;
        margin: 6px 0 0;
        text-align: left;
        font-size: 1.1rem;
      }
    </style>
  </head>

        ctx.fillStyle = 'rgba(255,255,255,.4)';
        ctx.beginPath();
        ctx.moveTo(bx - 27, by);
        ctx.lineTo(bx + 27, by);
        ctx.lineTo(bx + 20, by + 42);
        ctx.lineTo(bx - 20, by + 42);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = l.dk ? '#ffe9a8' : 'rgba(60,40,25,.55)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        for (let i = 0; i <= 6; i++) {
          const x = -27 + i * 9;
          ctx.moveTo(bx + x, by);
          ctx.lineTo(bx + x * 0.74, by + 42);
        }
        for (let j = 1; j < 4; j++) {
          const y = by + j * 10.5,
            k = 1 - j * 0.065;
          ctx.moveTo(bx - 27 * k, y);
          ctx.lineTo(bx + 27 * k, y);
        }
        ctx.stroke();
        ln(bx - 28, by, bx + 28, by, '#d63a22', 6);
        ctx.fillStyle = '#d63a22';
        for (const s of [-28, 28]) {
          ctx.beginPath();
          ctx.arc(bx + s, by, 5, 0, 7);
          ctx.fill();
        }
        ctx.restore();
      }
      const TC = [
        '#6b5644',
        '#6b5644',
        '#6b5644',
        '#5fd0ff',
        '#ff3df2',
        '#ffd23f',
        '#ff6a1a',
        '#4cd964',
        '#ffe14d',
        '#e0a070',
        '#cfd6e6',
        null,
        '#b36bff',
        '#7fe3ff',
        '#ffffff',
        '#ffd23f',
        '#ff4d6d',
        null,
        '#9ad8ff',
        '#ffb347',
        '#7aa2ff',
        '#ffd23f',
      ];
      let TR = [],
        PA = [],
        RG = [];
      function ring(x, y, c, rr) {
        RG.push({ x, y, l: 16, c, rr });
      }
      function burst(x, y, c, n) {
        for (let i = 0; i < n; i++) {
          const a = Math.random() * 6.283,
            s = 1.5 + Math.random() * 4;
          PA.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l: 22, c });
        }
      }
      function fxStep() {
        for (const o of LV[li].o) if (o.fl > 0) o.fl--;
        if (MS > 0) MS--;
        for (const p of TR) {
          p.l--;
          if (S.skin === 6) p.y -= 0.5;
        }
        TR = TR.filter((p) => p.l > 0);
        for (const p of PA) {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.15;
          p.l--;
        }
        PA = PA.filter((p) => p.l > 0);
        for (const r of RG) r.l--;
        RG = RG.filter((r) => r.l > 0);
        if (state === 'fly') {
          const bo = ball.boost > 0;
          if (bo) ball.boost--;
          const m = bo ? 26 : 16;
          TR.push({
            x: ball.x,
            y: ball.y,
            l: m,
            m,
            c: bo
              ? '#8dff9a'
              : LV[li].dk && TC[S.skin] === '#6b5644'
              ? '#9ad8ff'
              : TC[S.skin] || 'hsl(' + ((T * 9) % 360) + ',90%,65%)',
          });
        }
      }
      function drawFX() {
        for (const p of TR) {
          ctx.globalAlpha = (0.55 * p.l) / p.m;
          ctx.fillStyle = p.c;
          ctx.beginPath();
          ctx.arc(p.x, p.y, (R * 0.8 * p.l) / p.m + 1, 0, 7);
          ctx.fill();
        }
        for (const r of RG) {
          const k = 1 - r.l / 16;
          ctx.globalAlpha = 1 - k;
          ctx.strokeStyle = r.c;
          ctx.lineWidth = 4;
          ctx.shadowBlur = 12;
          ctx.shadowColor = r.c;
          ctx.beginPath();
          ctx.arc(r.x, r.y, 10 + k * (r.rr || 38), 0, 7);
          ctx.stroke();
          ctx.shadowBlur = 0;
        }
        for (const p of PA) {
          ctx.globalAlpha = p.l / 22;
          ctx.fillStyle = p.c;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 3, 0, 7);
          ctx.fill();
        }
        if (ball.boost > 0) {
          ctx.globalAlpha = 0.5;
          ctx.fillStyle = '#8dff9a';
          ctx.beginPath();
          ctx.arc(ball.x, ball.y, R + 6, 0, 7);
          ctx.fill();
        }
        if (MS > 0) {
          ctx.globalAlpha = Math.min(1, MS / 25);
          ctx.font = '700 22px Fredoka,system-ui,sans-serif';
          ctx.textAlign = 'center';
          ctx.lineWidth = 5;
          ctx.strokeStyle = 'rgba(0,0,0,.6)';
          ctx.strokeText(MT, W / 2, 70, W - 30);
          ctx.fillStyle = '#fff';
          ctx.fillText(MT, W / 2, 70, W - 30);
        }
        ctx.globalAlpha = 1;
      }
      function glow(o) {
        const a = o.fl / 14,
          e = (14 - o.fl) * 1.2;
        ctx.globalAlpha = a;
        if (o.w) {
          const m = Math.sin(o.sp * T),
            cx = o.x + o.mx * m,
            cy = o.y + o.my * m;
          ctx.strokeStyle = '#d4ffd9';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.roundRect(
            cx - o.w / 2 - e / 2,
            cy - o.h / 2 - e / 2,
            o.w + e,
            o.h + e,
            8
          );
          ctx.stroke();
        } else {
          const [x1, y1, x2, y2] = seg(o, T);
          ln(x1, y1, x2, y2, '#d4ffd9', o.r * 2 + e);
        }
        ctx.globalAlpha = 1;
      }
      function spikes(x, y, r) {
        ctx.fillStyle = '#5a0b16';
        for (let i = 0; i < 10; i++) {
          const a = i * 0.628 + T * 0.02;
          ctx.beginPath();
          ctx.moveTo(x + Math.cos(a) * (r + 6), y + Math.sin(a) * (r + 6));
          ctx.lineTo(
            x + Math.cos(a - 0.22) * (r - 2),
            y + Math.sin(a - 0.22) * (r - 2)
          );
          ctx.lineTo(
            x + Math.cos(a + 0.22) * (r - 2),
            y + Math.sin(a + 0.22) * (r - 2)
          );
          ctx.fill();
        }
      }
      function drawPT(l) {
        for (const p of l.pt || []) {
          const k = 1 + 0.12 * Math.sin(T * 0.12);
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.a);
          ctx.fillStyle = p.c;
          ctx.globalAlpha = 0.25;
          ctx.beginPath();
          ctx.ellipse(0, 0, 12 * k, 26 * k, 0, 0, 7);
          ctx.fill();
          ctx.globalAlpha = 1;
          ctx.strokeStyle = p.c;
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.ellipse(0, 0, 7, 22, 0, 0, 7);
          ctx.stroke();
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.ellipse(0, 0, 4, 17, 0, 0, 7);
          ctx.stroke();
          ctx.restore();
        }
      }
      function halo(o, x, y) {
        ctx.save();
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 6]);
        ctx.strokeStyle =
          o.mg > 0 ? 'rgba(190,130,255,.9)' : 'rgba(255,140,90,.9)';
        for (let i = 0; i < 3; i++) {
          const f = (((T * 0.012 * (o.mg > 0 ? -1 : 1) + i / 3) % 1) + 1) % 1;
          ctx.globalAlpha = 0.6 * (1 - f);
          ctx.beginPath();
          ctx.arc(x, y, o.r + (o.mr - o.r) * f, 0, 7);
          ctx.stroke();
        }
        ctx.restore();
      }
      function actSw(id, x, y) {
        if (ST[id]) return;
        ST[id] = 1;
        MT = 'Porta aperta!';
        MS = 75;
        burst(x, y, SWC[id][1], 16);
        ring(x, y, SWC[id][1], 70);
        for (const d of LV[li].o)
          if (d.dr === id) {
            const [x1, y1, x2, y2] = seg(d, T);
            for (let i = 0; i <= 10; i++)
              PA.push({
                x: x1 + ((x2 - x1) * i) / 10,
                y: y1 + ((y2 - y1) * i) / 10,
                vx: (Math.random() - 0.5) * 3,
                vy: -1 - Math.random() * 3,
                l: 28,
                c: SWC[id][1],
              });
            ring((x1 + x2) / 2, (y1 + y2) / 2, SWC[id][1], 60);
          }
      }
      function drawZN(l) {
        for (const z of l.zn || []) {
          const x = z.x - z.w / 2,
            y = z.y - z.h / 2;
          ctx.fillStyle =
            'rgba(60,220,200,' + (0.18 + 0.08 * Math.sin(T * 0.1)) + ')';
          ctx.strokeStyle = '#19d3c0';
          ctx.lineWidth = 2;
          ctx.setLineDash([6, 5]);
          ctx.fillRect(x, y, z.w, z.h);
          ctx.strokeRect(x, y, z.w, z.h);
          ctx.setLineDash([]);
          ctx.fillStyle = '#0b7d70';
          for (let i = 0; i < Math.floor(z.h / 26); i++) {
            const yy = y + 13 + i * 26;
            ctx.beginPath();
            ctx.moveTo(x + 3, yy - 5);
            ctx.lineTo(x + 3, yy + 5);
            ctx.lineTo(x + 10, yy);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x + z.w - 3, yy - 5);
            ctx.lineTo(x + z.w - 3, yy + 5);
            ctx.lineTo(x + z.w - 10, yy);
            ctx.fill();
          }
        }
      }
      function drawStones(l) {
        for (const s of l.st) {
          const r = s.r,
            sp = Math.hypot(s.vx, s.vy);
          if (sp > 0.6)
            for (let i = 1; i <= 4; i++) {
              ctx.globalAlpha = (0.16 * (5 - i)) / 4;
              ctx.fillStyle = '#bfe9ff';
              ctx.beginPath();
              ctx.roundRect(
                s.x - s.vx * i * 1.6 - r,
                s.y - s.vy * i * 1.6 - r,
                2 * r,
                2 * r,
                r * 0.45
              );
              ctx.fill();
            }
          ctx.globalAlpha = 1;
          ctx.save();
          ctx.translate(s.x - r, s.y - r);
          const g = ctx.createLinearGradient(0, 0, 2 * r, 2 * r);
          g.addColorStop(0, '#f2fcff');
          g.addColorStop(0.5, '#a9defa');
          g.addColorStop(1, '#5aaee6');
          ctx.fillStyle = g;
          ctx.strokeStyle = '#2f6fa3';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.roundRect(0, 0, 2 * r, 2 * r, r * 0.45);
          ctx.fill();
          ctx.stroke();
          ctx.strokeStyle = 'rgba(255,255,255,.85)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(r * 0.35, r * 0.9);
          ctx.lineTo(r * 0.9, r * 0.35);
          ctx.moveTo(r * 0.35, r * 1.3);
          ctx.lineTo(r * 1.3, r * 0.35);
          ctx.stroke();
          ctx.fillStyle = 'rgba(255,255,255,.5)';
          ctx.beginPath();
          ctx.roundRect(r * 0.3, r * 0.2, r * 0.8, r * 0.18, 3);
          ctx.fill();
          ctx.restore();
        }
      }
      function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
      }
      reset();
      loop();
    </script>
